<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamers Community — рекламный виджет OBS</title>
<meta name="description" content="Рекламный виджет Streamers Community. Предложить свой рекламный баннер: https://t.me/Mobyarik_bot">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;overflow:hidden}
body{padding:8px;color:#f5f5f7}
#banner{display:flex;align-items:center;gap:15px;width:100%;min-height:112px;padding:14px 18px;border:1px solid rgba(185,255,54,.28);border-radius:18px;background:rgba(11,11,15,.94);color:#f5f5f7;text-decoration:none;box-shadow:0 8px 28px rgba(0,0,0,.28);opacity:1;transition:opacity .35s ease,transform .35s ease}
body.transparent #banner{background:transparent;border-color:transparent;box-shadow:none}
body.no-bg #banner{background:transparent;border-color:transparent;box-shadow:none}
#avatar{width:76px;height:76px;flex:0 0 76px;border-radius:16px;object-fit:cover;background:#26262f}
#copy{display:flex;flex-direction:column;gap:6px;min-width:0}
#name{font-size:24px;font-weight:900;letter-spacing:-.04em}
#description{font-size:14px;line-height:1.35;color:#9a9aa8;overflow-wrap:anywhere}
#cta{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b9ff36}
body.hide-avatar #avatar,body.hide-name #name,body.hide-description #description,body.hide-cta #cta{display:none}
body.hide-name #copy{gap:4px}
@media(max-width:500px){#banner{min-height:86px;padding:10px;gap:10px}#avatar{width:58px;height:58px;flex-basis:58px}#name{font-size:19px}#description{font-size:12px}}
</style>
</head>
<body>
<a id="banner" href="https://www.twitch.tv/brill1antt" target="_blank" rel="noopener noreferrer">
<img id="avatar" alt="">
<span id="copy"><strong id="name">brill1antt</strong><span id="description">По вопросам рекламы и предложениям — brilliantt300@gmail.com.</span><span id="cta">Открыть Twitch ↗</span></span>
</a>
<script>
(()=>{
const params=new URLSearchParams(location.search);
const names=[
{name:"brill1antt",description:"18,5cm (яйца). По вопросам рекламы и предложениям: brilliantt300@gmail.com.",url:"https://www.twitch.tv/brill1antt",login:"brill1antt"},
{name:"mob_nadziratel",description:"Создатель Стримерского комьюнити. Стримы, игры и общение с сообществом.",url:"https://www.twitch.tv/mob_nadziratel",login:"mob_nadziratel"},
{name:"Низина Твича",description:"Telegram-канал Низины Твича — подписывайся на сообщество и следи за новостями.",url:"https://t.me/Ntwich",image:"https://i.ibb.co/67sHc76S/panel-1263981823-image-1a71f377-cc88-45c3-9ae2-800a963cfe80.png",cta:"Открыть Telegram ↗"}
];
const body=document.body;
if(params.get("bg")==="0"||params.get("transparent")==="1")body.classList.add("transparent");
if(params.get("bg")==="none")body.classList.add("no-bg");
if(params.get("avatar")==="0")body.classList.add("hide-avatar");
if(params.get("name")==="0")body.classList.add("hide-name");
if(params.get("description")==="0")body.classList.add("hide-description");
if(params.get("cta")==="0")body.classList.add("hide-cta");
const banner=document.getElementById("banner"),avatar=document.getElementById("avatar"),name=document.getElementById("name"),description=document.getElementById("description"),ctaEl=document.getElementById("cta");
let index=0,timer;

function placeholderSvg(n){
  const initials=(n||"?").slice(0,2).toUpperCase();
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" rx="22" fill="#26262f"/><text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="48" font-weight="bold" fill="#b9ff36">'+initials+'</text></svg>');
}

async function show(next){
 index=((next%names.length)+names.length)%names.length;
 const item=names[index];
 banner.style.opacity="0";
 await new Promise(resolve=>setTimeout(resolve,220));
 banner.href=item.url;
 name.textContent=item.name;
 description.textContent=item.description;
 ctaEl.textContent=item.cta||"Открыть Twitch ↗";
 avatar.alt=(item.image?"Логотип ":"Аватар ")+item.name;
 if(item.image){
   avatar.src=item.image;
 }else{
   avatar.src=placeholderSvg(item.name);
   try{
     const response=await fetch("/api/avatar?login="+encodeURIComponent(item.login||item.name),{cache:"no-store"});
     if(response.ok){
       const data=await response.json();
       if(data.avatarUrl&&/^https:\/\//i.test(data.avatarUrl))avatar.src=data.avatarUrl;
     }
   }catch(_){}
 }
 banner.style.opacity="1";
}
show(0);
const seconds=Math.max(3,Math.min(120,Number(params.get("interval"))||7));
timer=setInterval(()=>show(index+1),seconds*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){clearInterval(timer);timer=setInterval(()=>show(index+1),seconds*1000)}});
})();
</script>
</body>
</html>
