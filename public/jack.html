<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#171326">
  <title>Jack</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171326; }
    main { width: 100%; height: 100%; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .fallback { position: fixed; inset: auto 16px 16px; z-index: 2; padding: 12px 16px; border-radius: 12px; background: #211b35; color: #fff; font: 14px/1.45 system-ui, sans-serif; text-align: center; }
    .fallback a { color: #c7a7ff; }
  </style>
</head>
<body>
  <main>
    <iframe
      src="https://taplink.cc/mob_jack"
      title="Jack"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </main>
  <noscript><p class="fallback">Для просмотра страницы включите JavaScript или откройте <a href="https://taplink.cc/mob_jack">исходную страницу Taplink</a>.</p></noscript>
</body>
</html>
