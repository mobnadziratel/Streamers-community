<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1726">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
<title>Подкол — экран ведущего</title>
<style>
:root{color-scheme:dark;--bg:#0b1726;--line:rgba(164,218,239,.22);--text:#edf7ff;--muted:#a9bfd0;--accent:#8ce2f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#1d4560,transparent 55%),var(--bg);color:var(--text);display:flex;flex-direction:column}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:3vh 4vw;text-align:center;min-height:0}
h1{margin:0;font-size:clamp(28px,5vw,64px);letter-spacing:-.03em;line-height:1.1}h1 span{color:var(--accent)}
p{margin:0;color:var(--muted);font-size:clamp(15px,2vw,26px)}
.code{font-size:clamp(70px,16vw,200px);font-weight:900;letter-spacing:.12em;color:var(--accent);line-height:1;text-shadow:0 0 60px rgba(140,226,242,.35)}
.url{font-size:clamp(18px,2.6vw,34px);font-weight:800}
.players{display:flex;flex-wrap:wrap;gap:1.4vh 1.6vw;justify-content:center;max-width:1100px}
.chip{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;border:1px solid var(--line);background:rgba(20,46,67,.8);font-size:clamp(16px,2vw,26px);font-weight:800;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.chip.done{border-color:#69db7c;box-shadow:0 0 20px rgba(105,219,124,.25)}.chip small{color:#69db7c;font-size:.9em}
.dot{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;color:#10202e;font-weight:900}.dot.off{opacity:.4}
.timer{position:absolute;top:2vh;right:3vw;font-size:clamp(30px,5vw,72px);font-weight:900;color:var(--accent)}
.prompt{font-size:clamp(26px,4.6vw,62px);font-weight:900;line-height:1.15;max-width:1200px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:2.5vw;width:min(1300px,100%)}
.card{padding:3vh 2vw;border-radius:24px;border:2px solid var(--line);background:linear-gradient(145deg,rgba(20,46,67,.96),rgba(13,29,46,.96));font-size:clamp(20px,3.2vw,44px);font-weight:800;line-height:1.2;overflow-wrap:anywhere;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.card.win{border-color:#ffd43b;box-shadow:0 0 60px rgba(255,212,59,.3);transform:scale(1.04)}
.card small{display:block;margin-top:1.4vh;font-size:.5em;color:var(--muted)}.card b{display:block;font-size:.8em;color:var(--accent);margin-top:.6vh}
.bonus{font-size:clamp(30px,6vw,90px);font-weight:900;color:#ffd43b;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bars{display:flex;flex-direction:column;gap:1.2vh;width:min(900px,100%)}
.bar{display:flex;align-items:center;gap:14px;font-size:clamp(16px,2.4vw,32px);font-weight:800}
.bar .name{width:12ch;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;background:rgba(255,255,255,.07);border-radius:12px;overflow:hidden;height:1.7em}.bar .fill{height:100%;transition:width 1s cubic-bezier(.2,.8,.2,1);border-radius:12px}
.bar .pts{width:5ch;text-align:right}
#bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);background:rgba(8,18,30,.8)}
body.clean #bar{display:none}
button{font:inherit;font-weight:850;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 18px;cursor:pointer;color:var(--text);background:#17344c}
button.main{background:linear-gradient(135deg,#8ce5f3,#4daac8);color:#082032;border:0;font-size:18px;padding:12px 26px}button:disabled{opacity:.4}
.kick{margin-left:4px;background:none;border:0;color:var(--muted);padding:0 4px;font-size:18px}
.err{color:#ff9aa6;font-weight:700}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:700px){.duel{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="timer" class="timer"></div>
<div id="stage"></div>
<div id="bar"></div>
<script src="/party-common.js"></script>
<script>
(() => {
  const { h, api, clock, connect, dot } = Party, stage = document.getElementById("stage"), bar = document.getElementById("bar"), timer = document.getElementById("timer");
  const KEY = "party-host";
  let session = null, view = null, stop = null;
  try { session = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (_) {}
  const save = s => { session = s; try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (_) {} };
  const act = (route, extra) => api(route, Object.assign({ code: session.code, key: session.key }, extra || {})).catch(e => alert(e.message));
  const joinUrl = () => location.origin + "/party";

  function intro(error) {
    stop && stop(); timer.textContent = "";
    stage.replaceChildren(h("h1", {}, "По", h("span", {}, "дкол")), p("Игра для стрима: зрители и друзья отвечают на вопросы с телефонов, а все голосуют за лучшие ответы. Нужно от 3 игроков."),
      error ? h("div", { class: "err" }, error) : null,
      h("button", { class: "main", onclick: async e => { e.target.disabled = true; try { const r = await api("create"); save({ code: r.code, key: r.key }); begin(); } catch (err) { intro(err.message); } } }, "Создать комнату"));
    bar.replaceChildren(h("button", { onclick: () => document.body.classList.toggle("clean") }, "Скрыть панель (H)"));
  }
  function begin() {
    stop && stop();
    stop = connect(session.code, session.key, v => { view = v; render(); }, () => { save(null); intro("Комната закрыта или сервер перезапускался."); });
  }
  const chips = (list, withKick) => h("div", { class: "players" }, list.map(p => h("div", { class: "chip" + (p.done ? " done" : "") }, dot(p), p.name, p.done ? h("small", {}, "✓") : null,
    withKick ? h("button", { class: "kick", title: "Убрать игрока", onclick: () => act("kick", { id: p.id }) }, "×") : null)));

  function render() {
    const v = view, ph = v.phase;
    timer.textContent = ""; let nodes = [], controls = [];
    if (ph === "lobby") {
      nodes = [h("p", {}, "Заходи с телефона на"), h("div", { class: "url" }, joinUrl().replace(/^https?:\/\//, "")), h("div", { class: "code" }, v.code),
        v.players.length ? chips(v.players, true) : p0("Ждём игроков… (до 8, остальные могут быть зрителями)"),
        v.audience ? p0("Зрителей: " + v.audience) : null];
      controls = [h("button", { class: "main", disabled: v.players.length < v.min, onclick: () => act("start") }, v.players.length < v.min ? "Нужно игроков: " + v.min : "Старт")];
    } else if (ph === "answering") {
      nodes = [h("h1", {}, "Раунд " + v.round + " из " + v.rounds), p0("Пишите ответы на телефонах. У каждого два вопроса!"), chips(v.players)];
      controls = [h("button", { onclick: () => act("skip") }, "Закончить приём ответов")];
    } else if (ph === "voting") {
      nodes = [p0("Пара " + v.match.i + " из " + v.match.n), h("div", { class: "prompt" }, v.match.prompt),
        h("div", { class: "duel" }, v.match.answers.map(t => h("div", { class: "card" }, t))), p0("Голосов: " + v.votes + " — выбирайте на телефонах")];
      controls = [h("button", { onclick: () => act("skip") }, "Пропустить / закончить голосование")];
    } else if (ph === "reveal") {
      const top = Math.max(...v.reveal.map(r => r.votes));
      nodes = [h("div", { class: "prompt" }, v.match.prompt), h("div", { class: "duel" }, v.reveal.map(r => h("div", { class: "card" + (top > 0 && r.votes === top && !v.auto ? " win" : "") },
        r.text, h("small", {}, r.name), h("b", {}, r.votes + " гол. · +" + r.points)))), v.bonus ? h("div", { class: "bonus" }, "РАЗГРОМ! +бонус") : v.auto ? p0("Один из ответов не пришёл") : null];
      controls = [h("button", { onclick: () => act("skip") }, "Дальше")];
    } else {
      const list = v.players.slice().sort((a, b) => b.score - a.score), max = Math.max(1, list[0] ? list[0].score : 1), final = ph === "final";
      nodes = [h("h1", {}, final ? "🏆 " + (list[0] ? list[0].name : "") + " побеждает!" : "Счёт после раунда " + v.round),
        h("div", { class: "bars" }, list.map(x => h("div", { class: "bar" }, h("span", { class: "name" }, x.name), h("div", { class: "track" }, h("div", { class: "fill", style: "width:0;background:" + x.color, "data-w": Math.round(x.score / max * 100) })), h("span", { class: "pts" }, x.score))))];
      controls = final ? [h("button", { class: "main", onclick: () => act("restart") }, "Сыграть ещё")] : [h("button", { onclick: () => act("skip") }, "Дальше")];
      requestAnimationFrame(() => requestAnimationFrame(() => stage.querySelectorAll(".fill").forEach(f => { f.style.width = f.dataset.w + "%"; })));
    }
    stage.replaceChildren(...nodes.filter(Boolean));
    if (ph === "lobby" || ph === "final") controls.push(h("button", { onclick: () => confirm("Закрыть комнату для всех?") && act("close").then(() => { save(null); intro(); }) }, "Закрыть комнату"));
    controls.push(h("button", { onclick: () => document.body.classList.toggle("clean") }, "Скрыть панель (H)"));
    bar.replaceChildren(...controls);
    if (["answering", "voting"].includes(ph) && v.deadline) clock(timer);
  }
  const p0 = t => h("p", {}, t);
  const p = p0;
  document.addEventListener("keydown", e => { if (e.key.toLowerCase() === "h" && !/input|textarea/i.test(e.target.tagName)) document.body.classList.toggle("clean"); });
  if (session) begin(); else intro();
})();
</script>
</body>
</html>
