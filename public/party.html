<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1726">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
<title>Подкол — играть с телефона</title>
<style>
:root{color-scheme:dark;--bg:#0b1726;--panel:#122438;--line:rgba(164,218,239,.2);--text:#edf7ff;--muted:#a9bfd0;--accent:#8ce2f2;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:clip}
body{background:radial-gradient(ellipse at 50% -10%,#1d4560,transparent 55%),var(--bg);color:var(--text);padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100dvh}
main{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
h1{margin:6px 0 0;font-size:30px;letter-spacing:-.03em}h1 span{color:var(--accent)}
h2{margin:0;font-size:22px;line-height:1.25}p{margin:0;color:var(--muted);line-height:1.5}
.card{background:linear-gradient(145deg,rgba(20,46,67,.96),rgba(13,29,46,.96));border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
input,textarea{width:100%;font:inherit;font-size:18px;color:var(--text);background:#10263a;border:1px solid var(--line);border-radius:14px;padding:14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(140,226,242,.18)}
#code{text-transform:uppercase;letter-spacing:.35em;text-align:center;font-size:28px;font-weight:900}
textarea{min-height:110px;resize:none}
button{font:inherit;font-weight:850;font-size:17px;border:0;border-radius:14px;padding:15px;cursor:pointer;color:#082032;background:linear-gradient(135deg,#8ce5f3,#4daac8);transition:transform .12s,opacity .12s}
button:active{transform:scale(.97)}button:disabled{opacity:.45}
.choice{background:#17344c;color:var(--text);border:1px solid var(--line);text-align:left;padding:18px;font-size:18px;line-height:1.35}
.choice.picked{background:linear-gradient(135deg,#8ce5f3,#4daac8);color:#082032}
.check{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}.check input{width:20px;height:20px}
.err{color:#ff9aa6;font-weight:700;min-height:1.2em}
.timer{align-self:flex-end;font-size:26px;font-weight:900;color:var(--accent);min-width:2ch;text-align:right}
.dot{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#10202e;font-weight:900;font-size:14px}.dot.off{opacity:.4}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row b{margin-left:auto}
.me{outline:2px solid var(--accent);border-radius:10px;padding-left:6px}
.big{font-size:44px;font-weight:900;text-align:center;color:var(--accent)}
.hint{font-size:14px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script src="/party-common.js"></script>
<script>
(() => {
  const { h, api, clock, connect, dot } = Party, app = document.getElementById("app");
  const KEY = "party-session";
  let session = null, view = null, stop = null, sent = false;
  try { session = JSON.parse(localStorage.getItem("party-session") || "null"); } catch (_) {}
  const save = s => { session = s; try { s ? localStorage.setItem(KEY, JSON.stringify(s)) : localStorage.removeItem(KEY); } catch (_) {} };
  const prefill = new URLSearchParams(location.search).get("code") || "";

  function joinScreen(error) {
    app.replaceChildren(h("h1", {}, "По", h("span", {}, "дкол")), p("Игра в духе Quiplash: придумывай смешные ответы и голосуй за лучшие."));
    const code = h("input", { id: "code", maxlength: 4, placeholder: "КОД", autocomplete: "off", autocapitalize: "characters", value: prefill.toUpperCase() });
    const name = h("input", { id: "name", maxlength: 16, placeholder: "Твой ник", autocomplete: "nickname", value: localStorage.getItem("party-name") || "" });
    const aud = h("input", { type: "checkbox", id: "aud" });
    const err = h("div", { class: "err" }, error || "");
    const go = h("button", { onclick: async () => {
      err.textContent = ""; go.disabled = true;
      try {
        const c = code.value.trim().toUpperCase(); localStorage.setItem("party-name", name.value.trim());
        const r = await api("join", { code: c, name: name.value, audience: aud.checked });
        save({ code: c, token: r.token }); start();
      } catch (e) { err.textContent = e.message; go.disabled = false; }
    } }, "Войти");
    app.append(h("div", { class: "card" }, code, name, h("label", { class: "check" }, aud, "Я зритель: только голосую"), err, go));
    code.addEventListener("input", () => { code.value = code.value.toUpperCase().replace(/[^A-ZА-Я]/g, ""); });
  }
  const p = t => h("p", {}, t);

  function start() {
    if (stop) stop();
    stop = connect(session.code, session.token, v => { if (!view || view.phase !== v.phase || v.match?.i !== view.match?.i || v.round !== view.round) sent = false; view = v; render(); },
      () => { save(null); view = null; joinScreen("Комната закрыта. Введи код новой."); });
  }

  function render() {
    const v = view, aud = v.role === "audience", tm = h("div", { class: "timer", id: "tm" });
    const head = [h("h1", {}, v.code), v.me ? h("p", {}, v.me.name + " · " + v.me.score + " очк.") : p("Зритель" + (aud ? " · голосуешь за ответы" : ""))];
    let body;
    if (v.phase === "lobby") body = [h("div", { class: "card" }, h("h2", {}, aud ? "Ты зритель" : "Ты в игре!"), p("Смотри на экран: игра начнётся, когда хозяин нажмёт «Старт». Игроков: " + v.players.length + "."))];
    else if (v.phase === "answering") body = answering(v, aud);
    else if (v.phase === "voting") body = voting(v);
    else if (v.phase === "reveal") body = reveal(v);
    else body = scores(v);
    app.replaceChildren(...head, ...(v.deadline && ["answering", "voting"].includes(v.phase) ? [tm] : []), ...body);
    if (v.deadline) clock(tm);
  }

  function answering(v, aud) {
    if (aud) return [h("div", { class: "card" }, h("h2", {}, "Игроки пишут ответы"), p("Скоро начнётся голосование — твой голос тоже важен."))];
    const task = (v.tasks || []).find(t => t.answer === null);
    if (!task) return [h("div", { class: "card" }, h("h2", {}, "Ответы отправлены ✓"), p("Ждём остальных: готово " + v.players.filter(x => x.done).length + " из " + v.players.length + "."))];
    const ta = h("textarea", { maxlength: 70, placeholder: "Твой смешной ответ…" }), err = h("div", { class: "err" });
    const send = h("button", { onclick: async () => {
      if (!ta.value.trim()) return; send.disabled = true;
      try { await api("answer", { code: session.code, token: session.token, mi: task.mi, text: ta.value }); } catch (e) { err.textContent = e.message; send.disabled = false; }
    } }, "Отправить");
    const left = v.tasks.filter(t => t.answer === null).length;
    return [h("div", { class: "card" }, p("Вопрос " + (v.tasks.length - left + 1) + " из " + v.tasks.length), h("h2", {}, task.prompt), ta, err, send)];
  }

  function voting(v) {
    const m = v.match, picked = v.myVote;
    const head = h("div", { class: "card" }, p("Раунд " + v.round + " · пара " + m.i + " из " + m.n), h("h2", {}, m.prompt));
    if (v.isAuthor) return [head, h("div", { class: "card" }, h("h2", {}, "Это твой ответ 😎"), p("Голосовать за себя нельзя — жди результата."))];
    const btns = m.answers.map((text, side) => h("button", { class: "choice" + (picked === side ? " picked" : ""), onclick: async () => {
      try { await api("vote", { code: session.code, token: session.token, side }); } catch (_) {}
    } }, text));
    return [head, ...btns, h("p", { class: "hint" }, picked == null ? "Выбери ответ посмешнее" : "Голос принят — можно передумать")];
  }

  function reveal(v) {
    const win = Math.max(...v.reveal.map(r => r.votes));
    return [h("div", { class: "card" }, h("h2", {}, v.match.prompt), ...v.reveal.map(r => h("div", { class: "row" }, dot({ name: r.name || "?", color: r.color || "#888" }), h("span", {}, r.text + " — " + (r.name || "")), h("b", {}, "+" + r.points)))),
      v.bonus ? h("div", { class: "big" }, "РАЗГРОМ!") : v.auto ? p("Один из ответов не пришёл — очки получает второй.") : p(win ? "Голосов: " + v.reveal.map(r => r.votes).join(" : ") : "Никто не проголосовал")];
  }

  function scores(v) {
    const list = v.players.slice().sort((a, b) => b.score - a.score);
    const final = v.phase === "final", place = v.me ? list.findIndex(x => x.id === v.me.id) + 1 : 0;
    return [h("div", { class: "card" }, h("h2", {}, final ? "Итоги игры" : "Счёт после раунда " + v.round), ...list.map(x => h("div", { class: "row" + (v.me && x.id === v.me.id ? " me" : "") }, dot(x), h("span", {}, x.name), h("b", {}, x.score))),
      final && place ? p(place === 1 ? "🏆 Ты победил(а)!" : "Твоё место: " + place) : null)];
  }

  if (session) start(); else joinScreen();
})();
</script>
</body>
</html>
