<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamers Community — рекламный виджет OBS</title>
<meta name="description" content="Рекламный виджет Streamers Community. Предложить свой рекламный баннер: https://t.me/Mobyarik_bot">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent;overflow:hidden}
body{padding:6px;color:#fff}
#banner{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;
  padding:0;border:none;background:transparent;box-shadow:none;
  color:#fff;text-decoration:none;overflow:visible;
  opacity:1;transition:opacity .4s ease,transform .4s ease;
}
#art{
  display:block;flex:1;min-width:0;width:100%;height:auto;
  max-height:min(160px,28vw);
  object-fit:cover;object-position:center;
  border-radius:14px;background:#1a1020;
}
#qrWrap{
  flex:0 0 auto;width:68px;height:68px;border-radius:12px;
  overflow:hidden;background:#fff;
}
#qr{display:block;width:68px;height:68px;border-radius:12px;transition:opacity .3s ease}
body.hide-qr #qrWrap{display:none}
@media(max-width:480px){
  #art{max-height:110px;border-radius:12px}
  #qrWrap,#qr{width:54px;height:54px;border-radius:10px}
}
</style>
</head>
<body>
<a id="banner" href="https://www.twitch.tv/brill1antt" target="_blank" rel="noopener noreferrer">
  <img id="art" src="/ad-brill1antt.jpg" alt="brill1antt">
  <span id="qrWrap" title="QR-код"><img id="qr" alt="QR" width="68" height="68" decoding="async"></span>
</a>
<script>
(()=>{
const params=new URLSearchParams(location.search);
const names=[
{name:"brill1antt",url:"https://www.twitch.tv/brill1antt",image:"/ad-brill1antt.jpg"},
{name:"mob_nadziratel",url:"https://www.twitch.tv/mob_nadziratel",image:"/ad-mob_nadziratel.jpg"},
{name:"Низина Твича",url:"https://t.me/Ntwich",image:"/nizina-banner.png"}
];
if(params.get("qr")==="0")document.body.classList.add("hide-qr");
const banner=document.getElementById("banner"),art=document.getElementById("art"),qr=document.getElementById("qr");
let index=0,timer;

async function show(next){
 index=((next%names.length)+names.length)%names.length;
 const item=names[index];
 banner.style.opacity="0";
 banner.style.transform="translateY(6px)";
 await new Promise(r=>setTimeout(r,220));
 banner.href=item.url;
 art.src=item.image;
 art.alt=item.name;
 if(qr){
   qr.style.opacity="0";
   qr.src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=10&color=0b1726&bgcolor=ffffff&data="+encodeURIComponent(item.url);
   qr.onload=()=>{qr.style.opacity="1";};
 }
 banner.style.opacity="1";
 banner.style.transform="translateY(0)";
}
show(0);
const seconds=Math.max(3,Math.min(120,Number(params.get("interval"))||7));
timer=setInterval(()=>show(index+1),seconds*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){clearInterval(timer);timer=setInterval(()=>show(index+1),seconds*1000)}});
})();
</script>
</body>
</html>
